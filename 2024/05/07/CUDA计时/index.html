<figure class="highlight cpp"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br></pre></td><td class="code"><pre><span class="line">cudaEvent_t start, stop;</span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventCreate</span>(&amp;start), __FILE__, __LINE__);</span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventCreate</span>(&amp;stop), __FILE__, __LINE__);</span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventRecord</span>(start), __FILE__, __LINE__);</span><br><span class="line"><span class="built_in">cudaEventQuery</span>(start); <span class="comment">//这里不能用错误检测函数</span></span><br><span class="line">addFromGPU&lt;&lt;&lt;grid, block&gt;&gt;&gt;(fpDevice_A, fpDevice_B, fpDevice_C,iElemCount);<span class="comment">//这里放要计时的代码片段</span></span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventRecord</span>(stop), __FILE__, __LINE__);</span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventSynchronize</span>(stop), __FILE__, __LINE__);</span><br><span class="line"><span class="type">float</span> elapsed_time;<span class="comment">//这里存放计时结果</span></span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventElapsedTime</span>(&amp;elapsed_time, start, stop), __FILE__, __LINE__);</span><br><span class="line"></span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventDestroy</span>(start), __FILE__, __LINE__);</span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaEventDestroy</span>(stop), __FILE__, __LINE__);</span><br><span class="line"></span><br></pre></td></tr></table></figure>
