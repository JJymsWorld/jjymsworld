    <h2 id="错误检查函数"><a href="#错误检查函数" class="headerlink" title="错误检查函数"></a>错误检查函数</h2><ol>
<li>在调用CUDA运行时API时，调用ErrorCheck函数进行包装</li>
<li>参数<code>filename</code>一般使用<code>__FILE__</code>;参数<code>lineNumber</code>一般使用<code>__LINE__</code></li>
<li>错误函数返回运行时API调用的错误代码<figure class="highlight cpp"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line"><span class="function">cudaError_t <span class="title">ErrorCheck</span><span class="params">(cudaError_t error_code, <span class="type">const</span> <span class="type">char</span>* filename, <span class="type">int</span> lineNumber)</span></span>&#123;</span><br><span class="line">    <span class="keyword">if</span>(error_code != cudaSuccess)&#123;</span><br><span class="line">        <span class="built_in">printf</span>(<span class="string">&quot;CUDA error:\r\ncode=%d, name=%s, description=%s\r\nfile=%s, line=%d\r\n&quot;</span>, error_code, <span class="built_in">cudaGetErrorName</span>(error_code), <span class="built_in">cudaGetErrorString</span>(error_code), filename, lineNumber);</span><br><span class="line">        <span class="keyword">return</span> error_code;</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="keyword">return</span> error_code;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure></li>
</ol>
<h2 id="检查核函数"><a href="#检查核函数" class="headerlink" title="检查核函数"></a>检查核函数</h2><p>捕捉调用核函数可能发生错误的方法：</p>
<figure class="highlight cpp"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaGetLastError</span>(), __FILE__, __LINE__);</span><br><span class="line"><span class="built_in">ErrorCheck</span>(<span class="built_in">cudaDeviceSynchronize</span>(), __FILE__, __LINE__);</span><br></pre></td></tr></table></figure>
