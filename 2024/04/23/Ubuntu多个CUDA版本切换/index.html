    <div class="post-content">
    <p>服务器上存在多个CUDA版本时，一般在<code>/usr/local/</code>目录下有多个CUDA文件夹，如果要修改当前用户运行的CUDA版本，可以通过修改<code>.bashrc</code>文件来实现：</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">export PATH=/usr/local/cuda-11.3/bin:$PATH</span><br><span class="line">export LD_LIBRARY_PATH=/usr/local/cuda-11.3/lib64:$LD_LIBRARY_PATH</span><br></pre></td></tr></table></figure>

<p>当然，也可以通过链接来实现：</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">sudo rm -rf cuda</span><br><span class="line">sudo ln -s /usr/local/cuda-11.1/  /usr/local/cuda</span><br></pre></td></tr></table></figure>
</div>
