    <div class="post-content">
    <h3 id="创建两个独立的队列"><a href="#创建两个独立的队列" class="headerlink" title="创建两个独立的队列"></a>创建两个独立的队列</h3><p>为每个GPU创建一个单独的队列配置文件：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br></pre></td><td class="code"><pre><span class="line"><span class="built_in">mkdir</span> -p ~/.config/task-spooler</span><br><span class="line"><span class="built_in">touch</span> ~/.config/task-spooler/gpu0</span><br><span class="line"><span class="built_in">touch</span> ~/.config/task-spooler/gpu1</span><br></pre></td></tr></table></figure>
<h3 id="设置队列的GPU分配"><a href="#设置队列的GPU分配" class="headerlink" title="设置队列的GPU分配"></a>设置队列的GPU分配</h3><p>编辑队列配置文件，为每个队列指定使用的GPU：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 配置GPU0队列</span></span><br><span class="line"><span class="built_in">echo</span> <span class="string">&quot;export CUDA_VISIBLE_DEVICES=0&quot;</span> &gt; ~/.config/task-spooler/gpu0</span><br><span class="line"></span><br><span class="line"><span class="comment"># 配置GPU1队列</span></span><br><span class="line"><span class="built_in">echo</span> <span class="string">&quot;export CUDA_VISIBLE_DEVICES=1&quot;</span> &gt; ~/.config/task-spooler/gpu1</span><br></pre></td></tr></table></figure>
<h3 id="启动两个独立的Task-Spooler服务器"><a href="#启动两个独立的Task-Spooler服务器" class="headerlink" title="启动两个独立的Task Spooler服务器"></a>启动两个独立的Task Spooler服务器</h3><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 启动GPU0队列的服务器</span></span><br><span class="line">TS_SOCKET=~/.ts_gpu0 tsp -S</span><br><span class="line"></span><br><span class="line"><span class="comment"># 启动GPU1队列的服务器</span></span><br><span class="line">TS_SOCKET=~/.ts_gpu1 tsp -S</span><br></pre></td></tr></table></figure>
<h3 id="向不同的队列提交任务"><a href="#向不同的队列提交任务" class="headerlink" title="向不同的队列提交任务"></a>向不同的队列提交任务</h3><p>使用<code>TS_SOCKET</code>环境变量指定队列，向不同GPU提交任务：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 向GPU0队列提交任务</span></span><br><span class="line">TS_SOCKET=~/.ts_gpu0 tsp python my_script.py --param1 value1</span><br><span class="line"></span><br><span class="line"><span class="comment"># 向GPU1队列提交任务</span></span><br><span class="line">TS_SOCKET=~/.ts_gpu1 tsp python my_script.py --param2 value2</span><br></pre></td></tr></table></figure>
<h3 id="查看队列状态"><a href="#查看队列状态" class="headerlink" title="查看队列状态"></a>查看队列状态</h3><p>查看各个队列的状态</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># 查看GPU0队列状态</span></span><br><span class="line">TS_SOCKET=~/.ts_gpu0 tsp</span><br><span class="line"></span><br><span class="line"><span class="comment"># 查看GPU1队列状态</span></span><br><span class="line">TS_SOCKET=~/.ts_gpu1 tsp</span><br></pre></td></tr></table></figure>
<h3 id="自动化配置"><a href="#自动化配置" class="headerlink" title="自动化配置"></a>自动化配置</h3><p>为了方便使用，可以将一下别名添加到<code>~/.bashrc</code>中：</p>
<figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment"># Task Spooler GPU队列别名</span></span><br><span class="line"><span class="built_in">alias</span> tsp0=<span class="string">&#x27;TS_SOCKET=~/.ts_gpu0 tsp&#x27;</span></span><br><span class="line"><span class="built_in">alias</span> tsp1=<span class="string">&#x27;TS_SOCKET=~/.ts_gpu1 tsp&#x27;</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 启动GPU队列服务器的别名</span></span><br><span class="line"><span class="built_in">alias</span> tsp0-start=<span class="string">&#x27;TS_SOCKET=~/.ts_gpu0 tsp -S&#x27;</span></span><br><span class="line"><span class="built_in">alias</span> tsp1-start=<span class="string">&#x27;TS_SOCKET=~/.ts_gpu1 tsp -S&#x27;</span></span><br></pre></td></tr></table></figure>
