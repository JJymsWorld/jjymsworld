    <h2 id="rsync命令"><a href="#rsync命令" class="headerlink" title="rsync命令"></a>rsync命令</h2><h3 id="安装"><a href="#安装" class="headerlink" title="安装"></a>安装</h3><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">sudo apt install rsync</span><br></pre></td></tr></table></figure>

<h2 id="拷贝"><a href="#拷贝" class="headerlink" title="拷贝"></a>拷贝</h2><figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">rsync -a -z -r --info=progress2 ./temp ./des/</span><br></pre></td></tr></table></figure>

<p><code>-a</code>代表归档模式，保留符号链接、时间戳、文件权限、文件的用户组和组所有权<br><code>-z</code>表示压缩传输，传输大文件使用，小文件不用<br><code>-r</code>递归传输，用于传输文件夹<br><code>--info=progress2</code>使用进度条可视化传输进度</p>
<figure class="highlight shell"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">rsync -avuz -e &#x27;ssh -p 2222&#x27; user@remote-server:/path/to/remote/folder /path/to/local/folder</span><br></pre></td></tr></table></figure>
